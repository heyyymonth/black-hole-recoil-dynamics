name: Numerical verification

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install reference dependencies
        run: python -m pip install -r requirements-lock.txt
      - name: Independent numerical tests
        run: python -m pytest -q
      - name: Verify recorded experiment results
        run: python experiments/verify_results.py

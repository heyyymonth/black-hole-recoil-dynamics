name: Numerical verification

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: pip
      - name: Install reference dependencies
        run: python -m pip install -r requirements-lock.txt -r paper/requirements.txt
      - name: Independent numerical tests
        run: python -m pytest -q
      - name: Verify recorded experiment results
        run: python experiments/verify_results.py
      - name: Verify recorded close-passage experiment
        run: python experiments/verify_e003.py
      - name: Fetch and verify pinned external cluster snapshot
        run: python experiments/fetch_e004.py
      - name: Verify recorded cluster-snapshot comparison
        run: python experiments/verify_e004.py
      - name: Verify published paper provenance
        run: python paper/verify.py
      - name: Install pinned Tectonic
        shell: bash
        run: |
          curl --fail --silent --show-error --location 'https://github.com/tectonic-typesetting/tectonic/releases/download/tectonic%400.16.9/tectonic-0.16.9-x86_64-unknown-linux-gnu.tar.gz' --output "$RUNNER_TEMP/tectonic.tar.gz"
          echo "f3c825128095dc3399ea11c08c18035b33050a216930c295c79e8eb11bd21de4  $RUNNER_TEMP/tectonic.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/tectonic-bin"
          tar -xzf "$RUNNER_TEMP/tectonic.tar.gz" -C "$RUNNER_TEMP/tectonic-bin" tectonic
          echo "$RUNNER_TEMP/tectonic-bin" >> "$GITHUB_PATH"
      - name: Rebuild REVTeX manuscript
        run: python paper/build.py
      - name: Verify rebuilt manuscript
        run: python paper/verify.py
